<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Golden Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="blueBadge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#091e42"/>
    </linearGradient>

    <!-- Filter for Glow & Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle with Gold Border -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#dropShadow)"/>

  <!-- Sun Rays & Rising Sun (Top Center) -->
  <g transform="translate(256, 75)" opacity="0.95">
    <!-- Sun Rays -->
    <path d="M0 -38 L0 -52 M-25 -28 L-36 -40 M25 -28 L36 -40 M-38 0 L-52 0 M38 0 L52 0 M-30 20 L-42 28 M30 20 L42 28" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Sun Core -->
    <circle cx="0" cy="0" r="26" fill="url(#goldGrad)" filter="url(#glow)"/>
    <!-- Open Book Symbol of Education -->
    <path d="M0 8 C-18 -2, -38 -2, -54 8 L-54 36 C-38 26, -18 26, 0 34 C18 26, 38 26, 54 36 L54 8 C38 -2, 18 -2, 0 8 Z" fill="#ffffff" stroke="#1e3a8a" stroke-width="3" filter="url(#dropShadow)"/>
    <path d="M0 8 L0 34" stroke="#1e3a8a" stroke-width="2.5"/>
  </g>

  <!-- School Banner with Gold Trim (શ્રી સરકારી માધ્યમિક શાળા) -->
  <g transform="translate(256, 150)" filter="url(#dropShadow)">
    <path d="M -210 -28 C -100 -40, 100 -40, 210 -28 C 220 5, 210 18, 195 24 C 100 12, -100 12, -195 24 C -210 18, -220 5, -210 -28 Z" fill="url(#blueBadge)" stroke="url(#goldGrad)" stroke-width="5"/>
    <text x="0" y="2" fill="#ffffff" font-family="'Noto Sans Gujarati', 'Gujarati MT', 'Shruti', sans-serif" font-weight="900" font-size="25" text-anchor="middle" letter-spacing="1">
      શ્રી સરકારી માધ્યમિક શાળા
    </text>
  </g>

  <!-- Village / Town Sub-Banner (લાખાપર) -->
  <g transform="translate(256, 192)" filter="url(#dropShadow)">
    <rect x="-85" y="-15" width="170" height="30" rx="15" fill="#fef3c7" stroke="url(#goldGrad)" stroke-width="3"/>
    <text x="0" y="6" fill="#1e3a8a" font-family="'Noto Sans Gujarati', 'Gujarati MT', 'Shruti', sans-serif" font-weight="900" font-size="20" text-anchor="middle" letter-spacing="1.5">
      લાખાપર
    </text>
  </g>

  <!-- Center: Parking Bays P1, P2, P3 & Barrier Gate -->
  <g transform="translate(60, 225)">
    <!-- Parking Yard Roof Canopy -->
    <rect x="30" y="0" width="240" height="18" rx="4" fill="#334155" stroke="#64748b" stroke-width="2"/>

    <!-- Bay 1 (Occupied - Red) -->
    <rect x="40" y="18" width="65" height="90" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="3"/>
    <rect x="52" y="24" width="40" height="18" rx="4" fill="#f43f5e"/>
    <text x="72" y="38" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">P1</text>
    <!-- Car 1 (Red) -->
    <rect x="49" y="50" width="46" height="50" rx="8" fill="#dc2626"/>
    <rect x="53" y="62" width="38" height="20" rx="4" fill="#1e293b"/>

    <!-- Bay 2 (Empty - Green) -->
    <rect x="117" y="18" width="65" height="90" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
    <rect x="130" y="24" width="40" height="18" rx="4" fill="#10b981"/>
    <text x="150" y="38" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">P2</text>
    <circle cx="150" cy="72" r="16" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3"/>
    <text x="150" y="77" fill="#10b981" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">✔</text>

    <!-- Bay 3 (Occupied - Blue) -->
    <rect x="195" y="18" width="65" height="90" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="3"/>
    <rect x="207" y="24" width="40" height="18" rx="4" fill="#f43f5e"/>
    <text x="227" y="38" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">P3</text>
    <!-- Car 3 (Blue) -->
    <rect x="204" y="50" width="46" height="50" rx="8" fill="#2563eb"/>
    <rect x="208" y="62" width="38" height="20" rx="4" fill="#0f172a"/>

    <!-- Entrance Barrier Gate Column & Arm -->
    <rect x="0" y="65" width="22" height="60" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <circle cx="11" cy="85" r="7" fill="#dc2626"/>
    <!-- Barrier Gate Arm (Red/White stripes) -->
    <rect x="16" y="81" width="130" height="8" rx="2" fill="#ffffff" stroke="#991b1b" stroke-width="1.5"/>
    <rect x="30" y="81" width="16" height="8" fill="#dc2626"/>
    <rect x="62" y="81" width="16" height="8" fill="#dc2626"/>
    <rect x="94" y="81" width="16" height="8" fill="#dc2626"/>
    <rect x="126" y="81" width="16" height="8" fill="#dc2626"/>

    <!-- Smartphone on Right showing Mobile App -->
    <g transform="translate(290, 8)" filter="url(#dropShadow)">
      <!-- Phone Body -->
      <rect x="0" y="0" width="85" height="140" rx="16" fill="#020617" stroke="#38bdf8" stroke-width="3"/>
      <!-- Screen Notch -->
      <rect x="28" y="4" width="28" height="5" rx="2.5" fill="#1e293b"/>
      <!-- Wi-Fi Wave atop phone -->
      <path d="M 28 -12 A 18 18 0 0 1 56 -12 M 33 -7 A 12 12 0 0 1 51 -7 M 39 -2 A 5 5 0 0 1 45 -2" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- Slot Status list on phone screen -->
      <rect x="8" y="20" width="69" height="28" rx="6" fill="#f43f5e"/>
      <text x="14" y="38" fill="#fff" font-family="monospace" font-weight="bold" font-size="11">P1 FULL</text>
      
      <rect x="8" y="54" width="69" height="28" rx="6" fill="#10b981"/>
      <text x="14" y="72" fill="#fff" font-family="monospace" font-weight="bold" font-size="11">P2 EMPTY</text>
      
      <rect x="8" y="88" width="69" height="28" rx="6" fill="#f43f5e"/>
      <text x="14" y="106" fill="#fff" font-family="monospace" font-weight="bold" font-size="11">P3 FULL</text>
    </g>
  </g>

  <!-- Bottom: SMART PARKING SYSTEM 3D Badge with Wi-Fi & Gold Car Silhouette -->
  <g transform="translate(256, 420)" filter="url(#dropShadow)">
    <!-- Badge Background Shield with Gold Rim -->
    <path d="M -225 -25 C -110 -40, 110 -40, 225 -25 C 235 45, 140 68, 0 74 C -140 68, -235 45, -225 -25 Z" fill="url(#blueBadge)" stroke="url(#goldGrad)" stroke-width="6"/>

    <!-- Stylized Car Silhouette Outline -->
    <path d="M -70 -12 C -45 -24, 45 -24, 70 -12 C 80 -6, 85 2, 70 2 C 55 2, -55 2, -70 2 C -85 2, -80 -6, -70 -12 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85"/>

    <!-- Wi-Fi Waves Right -->
    <path d="M 125 -14 A 18 18 0 0 1 145 6 M 132 -9 A 12 12 0 0 1 148 5 M 139 -4 A 6 6 0 0 1 150 4" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- SMART PARKING Bold Metallic Text -->
    <text x="0" y="24" fill="url(#goldGrad)" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="36" text-anchor="middle" letter-spacing="3" filter="url(#dropShadow)">
      SMART PARKING
    </text>

    <!-- SYSTEM Subtitle with side lines -->
    <line x1="-120" y1="45" x2="-60" y2="45" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="0" y="50" fill="#ffffff" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="16" text-anchor="middle" letter-spacing="7">
      SYSTEM
    </text>
    <line x1="60" y1="45" x2="120" y2="45" stroke="url(#goldGrad)" stroke-width="2"/>
  </g>
</svg>
