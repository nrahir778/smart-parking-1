name: Build Native Android APK & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Node Dependencies
      run: npm install --legacy-peer-deps

    - name: Build Web Application
      run: npm run build --if-present

    - name: Sync Capacitor Android Project
      run: npx cap sync android || true

    - name: Generate Custom Icons
      run: |
        npm run icons:generate || true

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Configure Android Build Properties & SDK
      run: |
        PROPS_FILE=""
        if [ -f "android/gradle.properties" ]; then
          PROPS_FILE="android/gradle.properties"
        elif [ -f "gradle.properties" ]; then
          PROPS_FILE="gradle.properties"
        fi

        if [ -n "$PROPS_FILE" ]; then
          echo "android.useAndroidX=true" >> "$PROPS_FILE"
          echo "android.enableJetifier=false" >> "$PROPS_FILE"
          echo "compileSdkVersion=36" >> "$PROPS_FILE"
          echo "targetSdkVersion=36" >> "$PROPS_FILE"
          echo "minSdkVersion=24" >> "$PROPS_FILE"
        fi

        # Accept Android SDK licenses and ensure SDK platform 36 is ready
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" || true

    - name: Ensure Persistent Keystore Exists
      run: |
        if [ ! -f "android/app/debug.keystore" ]; then
          echo "debug.keystore not found, restoring persistent static keystore from seed..."
          echo "" | base64 -d > android/app/debug.keystore
        fi
        echo "Persistent debug.keystore verified (Consistent digital signature enabled for in-place APK updates)."

    - name: Grant Execute Permission for Gradle Wrapper
      run: |
        GRADLEW_PATH=$(find . -name gradlew -print -quit)
        if [ -n "$GRADLEW_PATH" ]; then
          chmod +x "$GRADLEW_PATH"
        fi

    - name: Build Debug APK
      run: |
        GRADLEW_PATH=$(find . -name gradlew -print -quit)
        GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
        cd "$GRADLEW_DIR"
        chmod +x ./gradlew
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Prepare Release APK with Latest Version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
        else
          VERSION="1.0.${{ github.run_number }}"
          TAG="v${VERSION}"
        fi
        
        APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" -print -quit 2>/dev/null)
        if [ -z "$APK_PATH" ]; then
          APK_PATH=$(find . -name "*.apk" -print -quit 2>/dev/null)
        fi
        
        echo "Found APK at: $APK_PATH"
        if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
          TARGET_APK="SmartParking-v${VERSION}.apk"
          LATEST_APK="SmartParking-latest.apk"
          
          cp "$APK_PATH" "$TARGET_APK"
          cp "$APK_PATH" "$LATEST_APK"
          
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "RELEASE_APK=${TARGET_APK}" >> $GITHUB_ENV
          echo "LATEST_APK=${LATEST_APK}" >> $GITHUB_ENV
        else
          echo "Error: No APK found after assembleDebug"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: parking-lot-apk
        path: |
          SmartParking-v*.apk
          SmartParking-latest.apk
          **/build/outputs/apk/debug/*.apk

    - name: Publish Direct GitHub Release
      if: github.event_name != 'pull_request'
      continue-on-error: true
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Smart Parking ${{ env.RELEASE_TAG }}
        draft: false
        prerelease: false
        make_latest: true
        body: |
          ## 🚗 Smart Parking System — Release ${{ env.RELEASE_TAG }}
          
          ### 📱 Direct APK Download
          Download the Android APK directly to your phone:
          - **[${{ env.RELEASE_APK }}](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/${{ env.RELEASE_APK }})** (Version-specific APK)
          - **[SmartParking-latest.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/${{ env.LATEST_APK }})** (Latest APK)
          
          ---
          
          #### 📋 Build Details:
          - **Version:** `${{ env.RELEASE_VERSION }}`
          - **Version Code:** `1000 + ${{ github.run_number }}`
          - **Commit:** `${{ github.sha }}`
          - **Seamless Updates:** Uses consistent signature key — install directly or update existing app in 1 tap without uninstalling!
        files: |
          ${{ env.RELEASE_APK }}
          ${{ env.LATEST_APK }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
